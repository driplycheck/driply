# Агент отвечает в своей теме в Telegram. Запускается ботом, работает по подписке Claude Code.
name: Агент

on:
  # По расписанию (время московское): аудит в 12:00, посты от PR-менеджера в 10:00 и 18:00.
  schedule:
    - cron: '0 9 * * *'     # тестировщик, аудит в 12:00 МСК
    - cron: '0 15 * * *'    # PR-менеджер, один пост в день в 18:00 МСК
    - cron: '0 6 * * 1'     # аналитик, итоги недели в понедельник, 09:00 МСК
  workflow_dispatch:
    inputs:
      kind:
        description: 'Кто отвечает: tester, analyst, dev, pr, designer'
        required: true
      message:
        description: 'Что нужно сделать'
        required: true
      thread_id:
        description: 'Тема в группе, куда отправить ответ'
        required: false

# Один агент — одна очередь: два сообщения подряд не запускают две гонки за один репозиторий.
concurrency:
  group: agent-${{ github.event.inputs.kind || github.event.schedule || 'chat' }}
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write   # действие берёт OIDC-токен, без него падает до запуска
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы проверить, не тронул ли агент main

      # Кто запускается и с какой задачей. По расписанию задачу выбираем сами,
      # из чата — берём присланную. Имя агента идёт в путь к файлу роли, поэтому проверяем.
      - name: выбрать агента и задачу
        env:
          IN_KIND: ${{ github.event.inputs.kind }}
          IN_TASK: ${{ github.event.inputs.message }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          KIND="$IN_KIND"
          TASK="$IN_TASK"
          if [ -z "$KIND" ]; then
            case "$SCHEDULE" in
              '0 9 * * *') KIND=tester ;;
              '0 6 * * 1') KIND=analyst ;;
              *)           KIND=pr ;;
            esac
          fi
          case "$KIND" in
            tester|analyst|dev|pr|designer) echo "агент: $KIND" ;;
            *) echo "::error::неизвестный агент «$KIND»"; exit 1 ;;
          esac
          if [ -z "$TASK" ] && [ "$KIND" = "tester" ]; then
            TASK='Ежедневный аудит. Прогони полную проверку прода, контракты и линтер, посмотри срез errors за последние сутки. Отчитайся коротко: что работает, что сломано, что тревожит. Если всё чисто — скажи одной строкой.'
          fi
          if [ -z "$TASK" ] && [ "$KIND" = "designer" ]; then
            TASK='Посмотри на снятые экраны и скажи, что выглядит плохо. Начни с короткого экрана и светлой темы. Не больше трёх замечаний, самое заметное первым.'
          fi
          if [ -z "$TASK" ] && [ "$KIND" = "analyst" ]; then
            TASK='Итоги недели. Возьми срезы growth, funnel, retention, content, economy за 7 дней и сравни с предыдущей неделей. Коротко: что изменилось, что требует действия, а что шум малых чисел.'
          fi
          if [ -z "$TASK" ]; then
            TASK='Пришли один готовый пост для канала. Сначала посмотри, что уже присылал сам (срез history) и что уже написано в marketing/build-posts-page.mjs — не повторяйся ни темой, ни зачином. Чередуй жанры: обновление продукта, польза читателю, живая цифра из статистики, вопрос аудитории. Если повода для анонса нет, напиши пост, полезный сам по себе, а не выдумывай новость.'
          fi
          {
            echo "KIND=$KIND"
            echo "MAIN_BEFORE=$(git rev-parse origin/main)"
            echo 'TASK<<AGENT_TASK_EOF'
            echo "$TASK"
            echo 'AGENT_TASK_EOF'
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # задачу кладём файлом внутри репозитория: за его пределы агент не видит,
      # а текст из чата так не попадает в YAML и ничего не ломает
      - name: положить задачу в файл
        run: |
          mkdir -p .agent
          printf '%s' "$TASK" > .agent/task.md
          # общие правила речи + роль: стиль один на всех, чтобы не расходился по файлам
          cat .github/agents/_style.md > .agent/role.md
          printf '\n\n' >> .agent/role.md
          cat ".github/agents/$KIND.md" >> .agent/role.md

      # правки кода уходят в отдельную ветку: в main агент попасть не может
      - name: ветка под правки
        if: env.KIND == 'dev'
        run: git checkout -b "agent/fix-${{ github.run_id }}"

      # список инструментов считаем заранее: длинное условие прямо в claude_args ломает разбор файла
      - name: список инструментов
        id: tools
        run: |
          if [ "$KIND" = "dev" ]; then
            echo 'list=Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(curl:*),Bash(git:*),Bash(gh pr:*)' >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = "pr" ]; then
            # PR-менеджер рисует обложку: ему нужно создавать файлы, но не трогать git
            echo 'list=Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*)' >> "$GITHUB_OUTPUT"
          else
            # curl обязателен: через него агенты берут статистику, здоровье и свою историю
            echo 'list=Read,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(curl:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*)' >> "$GITHUB_OUTPUT"
          fi

      # Экраны снимаем заранее: прогон скриншотов идёт минутами, инструмент уводит такую
      # команду в фон, а ждать агенту некого — он заканчивает ответ и прогон закрывается.
      - name: снимки экранов
        if: env.KIND == 'tester' || env.KIND == 'designer'
        continue-on-error: true
        timeout-minutes: 8
        working-directory: web
        env:
          SHOTS_TG_ID: ${{ secrets.SHOTS_TG_ID }}
          SHOTS_USER_ID: ${{ secrets.SHOTS_USER_ID }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/glance.mjs
          ls -la .shots/*.png || true

      # PR-менеджер рисует обложку в браузере — ставим его заранее
      - name: браузер для обложек
        if: env.KIND == 'pr'
        continue-on-error: true
        timeout-minutes: 6
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Твоя роль описана в файле .agent/role.md — прочитай его первым делом и следуй ему.
            Задача от основателя лежит в файле .agent/task.md — прочитай и выполни её.
            В конце дай короткий ответ по-русски: он уйдёт человеку в Telegram как есть.
          claude_args: --max-turns 60 --allowedTools "${{ steps.tools.outputs.list }}"
          show_full_output: true   # без этого ошибки агента не видно, только «is_error»
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
          # без этого `gh pr create` падает на авторизации, и разработчик
          # мог запушить ветку, но не мог открыть пулл-реквест
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOTS_TG_ID: ${{ secrets.SHOTS_TG_ID }}
          SHOTS_USER_ID: ${{ secrets.SHOTS_USER_ID }}
          TG_WEBHOOK_URL: ${{ secrets.TG_WEBHOOK_URL }}

      # Агент работает в отдельной ветке. Если main всё-таки сдвинулся — это авария,
      # и узнать о ней надо сразу, а не когда прод уедет.
      - name: main не тронут
        if: always()
        run: |
          git fetch -q origin main
          AFTER=$(git rev-parse origin/main)
          if [ "$AFTER" != "$MAIN_BEFORE" ]; then
            echo "::error::агент изменил main ($MAIN_BEFORE → $AFTER)"
            exit 1
          fi
          echo "main на месте"

      - name: отправить ответ в тему
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          HOOK: ${{ secrets.TG_WEBHOOK_URL }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
          THREAD_ID: ${{ github.event.inputs.thread_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/report-agent.mjs
