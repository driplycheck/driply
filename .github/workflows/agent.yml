# Агент отвечает в своей теме в Telegram. Запускается ботом, работает по подписке Claude Code.
name: Агент

on:
  # ежедневный аудит в 12:00 МСК, остальное — по запросу из Telegram
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Кто отвечает: tester, analyst, support, dev'
        required: true
      message:
        description: 'Что нужно сделать'
        required: true
      thread_id:
        description: 'Тема в группе, куда отправить ответ'
        required: false

# Один агент — одна очередь: два сообщения подряд не запускают две гонки за один репозиторий.
concurrency:
  group: agent-${{ github.event.inputs.kind || 'tester' }}
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write   # действие берёт OIDC-токен, без него падает до запуска
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы проверить, не тронул ли агент main

      # имя агента подставляется в путь к файлу роли — принимаем только известные
      - name: проверить, кто запускается
        env:
          KIND: ${{ github.event.inputs.kind || 'tester' }}
        run: |
          case "$KIND" in
            tester|analyst|dev|pr) echo "агент: $KIND" ;;
            *) echo "::error::неизвестный агент «$KIND»"; exit 1 ;;
          esac
          echo "MAIN_BEFORE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # задачу кладём файлом внутри репозитория: за его пределы агент не видит,
      # а текст из чата так не попадает в YAML и ничего не ломает
      - name: положить задачу в файл
        env:
          KIND: ${{ github.event.inputs.kind || 'tester' }}
          TASK: "${{ github.event.inputs.message || 'Ежедневный аудит. Прогони полную проверку прода, контракты и линтер. Отчитайся коротко — что работает, что сломано, что тревожит. Если всё чисто, так и скажи одной строкой, не растекайся.' }}"
        run: |
          mkdir -p .agent
          printf '%s' "$TASK" > .agent/task.md
          cp ".github/agents/$KIND.md" .agent/role.md

      # правки кода уходят в отдельную ветку: в main агент попасть не может
      - name: ветка под правки
        if: github.event.inputs.kind == 'dev'
        run: git checkout -b "agent/fix-${{ github.run_id }}"

      # список инструментов считаем заранее: длинное условие прямо в claude_args ломает разбор файла
      - name: список инструментов
        id: tools
        env:
          KIND: ${{ github.event.inputs.kind || 'tester' }}
        run: |
          if [ "$KIND" = "dev" ]; then
            echo 'list=Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr:*)' >> "$GITHUB_OUTPUT"
          else
            echo 'list=Read,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*)' >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Твоя роль описана в файле .agent/role.md — прочитай его первым делом и следуй ему.
            Задача от основателя лежит в файле .agent/task.md — прочитай и выполни её.
            В конце дай короткий ответ по-русски: он уйдёт человеку в Telegram как есть.
          claude_args: --max-turns 60 --allowedTools "${{ steps.tools.outputs.list }}"
          show_full_output: true   # без этого ошибки агента не видно, только «is_error»
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
          SHOTS_TG_ID: ${{ secrets.SHOTS_TG_ID }}
          SHOTS_USER_ID: ${{ secrets.SHOTS_USER_ID }}
          TG_WEBHOOK_URL: ${{ secrets.TG_WEBHOOK_URL }}

      # Агент работает в отдельной ветке. Если main всё-таки сдвинулся — это авария,
      # и узнать о ней надо сразу, а не когда прод уедет.
      - name: main не тронут
        if: always()
        run: |
          git fetch -q origin main
          AFTER=$(git rev-parse origin/main)
          if [ "$AFTER" != "$MAIN_BEFORE" ]; then
            echo "::error::агент изменил main ($MAIN_BEFORE → $AFTER)"
            exit 1
          fi
          echo "main на месте"

      - name: отправить ответ в тему
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          HOOK: ${{ secrets.TG_WEBHOOK_URL }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
          THREAD_ID: ${{ github.event.inputs.thread_id }}
          KIND: ${{ github.event.inputs.kind || 'tester' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/report-agent.mjs
